<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roomie Connect - Find Roommates</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #6a1b9a 0%, #9c4dcc 100%); min-height: 100vh; display: flex; }
    .sidebar { width: 220px; background: rgba(0,0,0,0.3); padding: 24px 16px; display: flex; flex-direction: column; gap: 8px; min-height: 100vh; flex-shrink: 0; }
    .sidebar h2 { color: #fff; font-size: 18px; margin-bottom: 16px; text-align: center; }
    .sidebar a { color: #e1bee7; text-decoration: none; padding: 10px 14px; border-radius: 8px; font-size: 14px; display: block; transition: background 0.2s; }
    .sidebar a:hover, .sidebar a.active { background: rgba(255,255,255,0.2); color: #fff; }
    .main { flex: 1; padding: 24px; overflow-y: auto; }
    h1 { color: #fff; font-size: 22px; margin-bottom: 4px; }
    .sub { color: #ce93d8; font-size: 13px; margin-bottom: 20px; }
    .filter-card { background: rgba(20,0,40,0.75); border-radius: 14px; padding: 20px; margin-bottom: 20px; color: #fff; }
    .filter-card h3 { font-size: 14px; color: #ce93d8; margin-bottom: 14px; text-transform: uppercase; letter-spacing: 0.5px; }
    .filter-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .chip { padding: 7px 14px; border-radius: 20px; border: 1.5px solid rgba(255,255,255,0.2); color: #e1bee7; font-size: 13px; cursor: pointer; transition: all 0.2s; background: transparent; }
    .chip:hover { border-color: #ce93d8; }
    .chip.on { background: rgba(206,147,216,0.3); border-color: #ce93d8; color: #fff; }
    .filter-inputs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .filter-inputs input { padding: 9px 12px; background: rgba(255,255,255,0.1); border: 1.5px solid rgba(255,255,255,0.2); border-radius: 8px; font-size: 13px; color: #fff; width: 100%; }
    .filter-inputs input::placeholder { color: rgba(255,255,255,0.4); }
    .search-btn { padding: 10px 28px; background: #7b1fa2; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .search-btn:hover { background: #9c4dcc; }
    .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .profile-card { background: rgba(20,0,40,0.80); border-radius: 14px; padding: 20px; color: #fff; border: 1px solid rgba(255,255,255,0.08); transition: transform 0.2s; }
    .profile-card:hover { transform: translateY(-2px); border-color: rgba(206,147,216,0.3); }
    .pc-avatar { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg,#ce93d8,#7b1fa2); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; margin-bottom: 10px; }
    .pc-name { font-size: 16px; font-weight: 600; margin-bottom: 2px; }
    .pc-loc { font-size: 12px; color: #ce93d8; margin-bottom: 10px; }
    .pc-badges { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; }
    .pc-badge { font-size: 11px; padding: 3px 8px; border-radius: 10px; background: rgba(206,147,216,0.15); border: 1px solid rgba(206,147,216,0.3); color: #e1bee7; }
    .pc-budget { font-size: 13px; color: #a5d6a7; margin-bottom: 12px; }
    .pc-btn { width: 100%; padding: 9px; background: #7b1fa2; color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .pc-btn:hover { background: #9c4dcc; }
    .pc-btn.sent { background: rgba(255,255,255,0.1); color: #ce93d8; cursor: default; }
    .empty { text-align: center; color: #ce93d8; padding: 40px; font-size: 15px; }
    .loading { text-align: center; color: #ce93d8; padding: 30px; }
  </style>
</head>
<body>
  <div class="sidebar">
    <h2>🏠 Roomie Connect</h2>
    <a href="home.html">My Preferences</a>
    <a href="profile.html">My Profile</a>
    <a href="search.html" class="active">Find Roommates</a>
    <a href="requests.html">📩 Requests</a>
    <a href="chat.html">💬 Chats</a>
    <a href="index.html" onclick="logout()" style="margin-top:auto;color:#f48fb1;">Logout</a>
  </div>

  <div class="main">
    <h1>Find Roommates</h1>
    <p class="sub">Filter by your preferences to find compatible roommates</p>

    <div class="filter-card">
      <h3>Filters</h3>
      <div class="filter-row" id="gender-chips">
        <button class="chip" onclick="toggleChip(this,'gender','male')">👨 Male</button>
        <button class="chip" onclick="toggleChip(this,'gender','female')">👩 Female</button>
      </div>
      <div class="filter-row" id="diet-chips">
        <button class="chip" onclick="toggleChip(this,'diet','veg')">🥗 Veg</button>
        <button class="chip" onclick="toggleChip(this,'diet','nonveg')">🍗 Non-Veg</button>
      </div>
      <div class="filter-row" id="personality-chips">
        <button class="chip" onclick="toggleChip(this,'personality','introvert')">🎧 Introvert</button>
        <button class="chip" onclick="toggleChip(this,'personality','extrovert')">🎉 Extrovert</button>
      </div>
      <div class="filter-row" id="schedule-chips">
        <button class="chip" onclick="toggleChip(this,'schedule','morningbird')">🌅 Morning Bird</button>
        <button class="chip" onclick="toggleChip(this,'schedule','nightowl')">🌙 Night Owl</button>
      </div>
      <div class="filter-inputs">
        <input type="text" id="f-location" placeholder="📍 Location">
        <input type="number" id="f-minbudget" placeholder="₹ Min budget">
        <input type="number" id="f-maxbudget" placeholder="₹ Max budget">
      </div>
      <button class="search-btn" onclick="doSearch()">🔍 Search</button>
      <button class="search-btn" onclick="clearFilters()" style="background:transparent;border:1px solid rgba(255,255,255,0.2);margin-left:8px;">Clear</button>
    </div>

    <div id="resultsArea"><div class="loading">Click Search to find roommates...</div></div>
  </div>

  <script src="api.js"></script>
  <script>
    requireAuth();
    const filters = { gender: null, diet: null, personality: null, schedule: null };

    function toggleChip(el, field, value) {
      const group = el.closest('.filter-row').querySelectorAll('.chip');
      group.forEach(c => c.classList.remove('on'));
      if (filters[field] === value) { filters[field] = null; }
      else { filters[field] = value; el.classList.add('on'); }
    }

    function clearFilters() {
      Object.keys(filters).forEach(k => filters[k] = null);
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
      document.getElementById('f-location').value = '';
      document.getElementById('f-minbudget').value = '';
      document.getElementById('f-maxbudget').value = '';
    }

    async function doSearch() {
      const area = document.getElementById('resultsArea');
      area.innerHTML = '<div class="loading">Searching...</div>';
      const params = {};
      if (filters.gender)      params.gender = filters.gender;
      if (filters.diet)        params.diet = filters.diet;
      if (filters.personality) params.personality = filters.personality;
      if (filters.schedule)    params.schedule = filters.schedule;
      const loc = document.getElementById('f-location').value.trim();
      const minB = document.getElementById('f-minbudget').value;
      const maxB = document.getElementById('f-maxbudget').value;
      if (loc)  params.location = loc;
      if (minB) params.minBudget = minB;
      if (maxB) params.maxBudget = maxB;

      try {
        const res = await api.searchRoommates(params);
        if (!res.users.length) {
          area.innerHTML = '<div class="empty">😔 No roommates found with these filters.<br>Try adjusting your filters.</div>';
          return;
        }
        area.innerHTML = `<div style="color:#ce93d8;font-size:13px;margin-bottom:14px">${res.count} roommate${res.count!==1?'s':''} found</div><div class="results-grid" id="grid"></div>`;
        const grid = document.getElementById('grid');
        res.users.forEach(u => {
          const initials = (u.name||'U').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
          const badges = [u.diet,u.personality,u.schedule].filter(Boolean);
          const labelMap = {veg:'🥗 Veg',nonveg:'🍗 Non-Veg',introvert:'🎧 Introvert',extrovert:'🎉 Extrovert',morningbird:'🌅 Morning Bird',nightowl:'🌙 Night Owl'};
          const div = document.createElement('div');
          div.className = 'profile-card';
          div.innerHTML = `
            <div class="pc-avatar">${initials}</div>
            <div class="pc-name">${u.name}</div>
            <div class="pc-loc">📍 ${u.location||'Location not set'}</div>
            <div class="pc-badges">${badges.map(b=>`<span class="pc-badge">${labelMap[b]||b}</span>`).join('')}</div>
            <div class="pc-budget">💰 ₹${(u.budget||0).toLocaleString()}/month</div>
            <button class="pc-btn" id="btn-${u.id}" onclick="sendRequest(${u.id}, this)">📩 Send Request</button>
          `;
          grid.appendChild(div);
        });
      } catch(err) {
        area.innerHTML = `<div class="empty">❌ ${err.message}</div>`;
      }
    }

    async function sendRequest(userId, btn) {
      btn.disabled = true;
      btn.textContent = 'Sending...';
      try {
        await api.sendContactRequest(userId, 'Hi! I found your profile and would love to connect as roommates.');
        btn.textContent = '✅ Request Sent';
        btn.classList.add('sent');
      } catch(err) {
        btn.textContent = err.message.includes('already') ? '✅ Already Sent' : '❌ Failed';
        btn.classList.add('sent');
      }
    }

    // Auto search on load
    doSearch();
  </script>
</body>
</html>
