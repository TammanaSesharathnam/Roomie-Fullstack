<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roomie Connect - My Profile</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #6a1b9a 0%, #9c4dcc 100%); min-height: 100vh; display: flex; }
    .sidebar { width: 220px; background: rgba(0,0,0,0.3); padding: 24px 16px; display: flex; flex-direction: column; gap: 8px; min-height: 100vh; }
    .sidebar h2 { color: #fff; font-size: 18px; margin-bottom: 16px; text-align: center; }
    .sidebar a { color: #e1bee7; text-decoration: none; padding: 10px 14px; border-radius: 8px; font-size: 14px; display: block; transition: background 0.2s; }
    .sidebar a:hover, .sidebar a.active { background: rgba(255,255,255,0.2); color: #fff; }
    .main { flex: 1; padding: 30px; display: flex; align-items: flex-start; justify-content: center; }
    .card { background: rgba(20,0,40,0.80); border-radius: 20px; padding: 36px; max-width: 540px; width: 100%; color: #fff; }
    .avatar { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg,#ce93d8,#7b1fa2); display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 700; color: #fff; margin: 0 auto 16px; }
    h1 { text-align: center; font-size: 24px; margin-bottom: 4px; }
    .email { text-align: center; color: #ce93d8; font-size: 13px; margin-bottom: 24px; }
    .badges { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 24px; }
    .badge { padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; background: rgba(206,147,216,0.2); border: 1px solid rgba(206,147,216,0.4); color: #e1bee7; }
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 24px; }
    .info-item { background: rgba(255,255,255,0.07); border-radius: 10px; padding: 14px; }
    .info-label { font-size: 11px; color: #ce93d8; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .info-value { font-size: 15px; font-weight: 600; color: #fff; }
    .bio-box { background: rgba(255,255,255,0.07); border-radius: 10px; padding: 14px; margin-bottom: 24px; }
    .bio-label { font-size: 11px; color: #ce93d8; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    .bio-text { font-size: 14px; color: #e1bee7; line-height: 1.6; }
    .btn { display: block; width: 100%; padding: 13px; background: #7b1fa2; color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; text-align: center; text-decoration: none; margin-bottom: 10px; }
    .btn:hover { background: #9c4dcc; }
    .btn-outline { background: transparent; border: 2px solid rgba(206,147,216,0.5); color: #ce93d8; }
    .btn-outline:hover { background: rgba(206,147,216,0.1); }
  </style>
</head>
<body>
  <div class="sidebar">
    <h2>🏠 Roomie Connect</h2>
    <a href="home.html">My Preferences</a>
    <a href="profile.html" class="active">My Profile</a>
    <a href="search.html">Find Roommates</a>
    <a href="requests.html">📩 Requests</a>
    <a href="chat.html">💬 Chats</a>
    <a href="index.html" onclick="logout()" style="margin-top:auto;color:#f48fb1;">Logout</a>
  </div>

  <div class="main">
    <div class="card">
      <div class="avatar" id="avatarEl">?</div>
      <h1 id="nameEl">Loading...</h1>
      <div class="email" id="emailEl"></div>

      <div class="badges" id="badgesEl"></div>

      <div class="info-grid">
        <div class="info-item"><div class="info-label">Location</div><div class="info-value" id="locationEl">—</div></div>
        <div class="info-item"><div class="info-label">Budget</div><div class="info-value" id="budgetEl">—</div></div>
        <div class="info-item"><div class="info-label">Gender</div><div class="info-value" id="genderEl">—</div></div>
        <div class="info-item"><div class="info-label">Phone</div><div class="info-value" id="phoneEl">—</div></div>
      </div>

      <div class="bio-box">
        <div class="bio-label">About Me</div>
        <div class="bio-text" id="bioEl">No bio yet.</div>
      </div>

      <a href="search.html" class="btn">🔍 Find Roommates</a>
      <a href="home.html" class="btn btn-outline">✏️ Edit Preferences</a>
    </div>
  </div>

  <script src="api.js"></script>
  <script>
    requireAuth();

    const labelMap = {
      veg: '🥗 Vegetarian', nonveg: '🍗 Non-Veg',
      male: '👨 Male', female: '👩 Female', other: '🧑 Other',
      introvert: '🎧 Introvert', extrovert: '🎉 Extrovert',
      morningbird: '🌅 Morning Bird', nightowl: '🌙 Night Owl'
    };

    window.onload = async function() {
      try {
        const res = await api.getMyProfile();
        const u = res.user;
        const initials = (u.name || 'U').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
        document.getElementById('avatarEl').textContent = initials;
        document.getElementById('nameEl').textContent = u.name || 'No name';
        document.getElementById('emailEl').textContent = u.email;
        document.getElementById('locationEl').textContent = u.location || '—';
        document.getElementById('budgetEl').textContent = u.budget ? '₹' + u.budget.toLocaleString() : '—';
        document.getElementById('genderEl').textContent = u.gender ? u.gender.charAt(0).toUpperCase()+u.gender.slice(1) : '—';
        document.getElementById('phoneEl').textContent = u.phone || '—';
        document.getElementById('bioEl').textContent = u.bio || 'No bio yet.';
        const badges = [u.diet, u.personality, u.schedule].filter(Boolean);
        document.getElementById('badgesEl').innerHTML = badges.map(b => `<span class="badge">${labelMap[b]||b}</span>`).join('');
      } catch(e) {
        const user = getUser();
        if (user) {
          document.getElementById('nameEl').textContent = user.name || 'No name';
          document.getElementById('emailEl').textContent = user.email || '';
        }
      }
    };
  </script>
</body>
</html>
