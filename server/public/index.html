<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roomie Connect - Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #6a1b9a 0%, #9c4dcc 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.25);
      text-align: center;
    }
    .logo { font-size: 32px; font-weight: 800; color: #6a1b9a; margin-bottom: 4px; }
    .tagline { color: #9c4dcc; font-size: 14px; margin-bottom: 28px; }
    .form-group { margin-bottom: 16px; text-align: left; }
    label { font-size: 13px; color: #555; display: block; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      transition: border 0.2s;
    }
    input:focus { outline: none; border-color: #6a1b9a; }
    .btn {
      width: 100%;
      padding: 13px;
      background: #6a1b9a;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }
    .btn:hover { background: #9c4dcc; }
    .btn-outline {
      background: transparent;
      border: 2px solid #6a1b9a;
      color: #6a1b9a;
      margin-top: 10px;
    }
    .btn-outline:hover { background: #f3e5f5; }
    .divider { margin: 18px 0; color: #aaa; font-size: 13px; }
    .error-msg { color: #e53935; font-size: 13px; margin-top: 10px; display: none; }
    .forgot { font-size: 13px; color: #6a1b9a; text-decoration: none; float: right; }
    .forgot:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🏠 Roomie Connect</div>
    <div class="tagline">Find Another Me</div>

    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="you@example.com">
    </div>

    <div class="form-group">
      <label>Password <a href="#" class="forgot">Forgot?</a></label>
      <input type="password" id="password" placeholder="••••••••">
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <button class="btn" onclick="doLogin()">Login</button>
    <div class="divider">— or —</div>
    <button class="btn btn-outline" onclick="window.location.href='register.html'">Create an Account</button>
  </div>

  <script src="api.js"></script>
  <script>
    // Redirect if already logged in
    if (sessionStorage.getItem('rc_token')) window.location.href = 'home.html';

    async function doLogin() {
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const errEl    = document.getElementById('errorMsg');
      errEl.style.display = 'none';

      if (!email || !password) {
        errEl.textContent = 'Please enter email and password.';
        errEl.style.display = 'block';
        return;
      }

      try {
        const data = await api.login(email, password);
        saveSession(data.token, data.user);
        window.location.href = 'home.html';
      } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
      }
    }

    // Allow Enter key
    document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  </script>
</body>
</html>
