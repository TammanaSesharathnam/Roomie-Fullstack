<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hostel Map - Roomie Connect</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; font-size: 14px; min-height: 100vh; background: linear-gradient(135deg, #6a1b9a 0%, #9c4dcc 100%); display: flex; flex-direction: column; }
        /* ── TOPBAR (mobile) ── */
        .topbar { display:none; background:#6a1b9a; padding:12px 16px; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; box-shadow:0 2px 8px rgba(0,0,0,0.3); }
        .topbar .tbrand { color:#fff; font-size:15px; font-weight:700; }
        .hamburger { background:none; border:none; cursor:pointer; padding:4px; display:flex; flex-direction:column; gap:5px; }
        .hamburger span { display:block; width:22px; height:2px; background:#fff; border-radius:2px; }
        .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:150; }
        .overlay.show { display:block; }
        /* ── SIDEBAR ── */
        .app-body { display:flex; flex:1; }
        .sidebar { width:220px; min-height:100vh; flex-shrink:0; background:#6a1b9a; padding:20px 14px; display:flex; flex-direction:column; gap:4px; z-index:200; transition:transform 0.28s; }
        .sidebar .brand { color:#fff; font-size:16px; font-weight:700; text-align:center; padding:12px 2px 22px; }
        .sidebar a { color:rgba(255,255,255,0.75); text-decoration:none; font-size:14px; display:block; padding:10px 14px; border-radius:8px; transition:background 0.2s; }
        .sidebar a:hover, .sidebar a.active { background:rgba(255,255,255,0.2); color:#fff; }
        .sidebar .logout { margin-top:auto; color:#f48fb1 !important; }
        /* ── MAIN ── */
        .main { flex:1; display:flex; flex-direction:column; padding:20px; gap:12px; overflow:hidden; }
        .page-title { color:#fff; font-size:14px; font-weight:700; margin-bottom:2px; }
        .sub { color:#ce93d8; font-size:14px; }
        .search-bar { background:rgba(20,0,40,0.82); border-radius:12px; padding:14px 16px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
        .search-bar input { flex:1; min-width:140px; padding:10px 13px; background:rgba(255,255,255,0.1); border:1.5px solid rgba(255,255,255,0.2); border-radius:8px; font-size:14px; color:#fff; }
        .search-bar input::placeholder { color:rgba(255,255,255,0.4); }
        .search-bar input:focus { outline:none; border-color:#ce93d8; }
        .search-bar select { padding:10px; background:rgba(40,0,70,0.95); border:1.5px solid rgba(255,255,255,0.2); border-radius:8px; font-size:14px; color:#fff; cursor:pointer; }
        .search-bar select option { background:#2d0050; color:#fff; }
        .btn { padding:10px 16px; background:#7b1fa2; color:#fff; border:none; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; white-space:nowrap; }
        .btn:hover { background:#9c4dcc; }
        .btn-sec { background:rgba(255,255,255,0.12); border:1.5px solid rgba(255,255,255,0.2); color:#fff; }
        .free-badge { background:rgba(76,175,80,0.2); border:1px solid #4caf50; border-radius:20px; padding:4px 10px; color:#a5d6a7; font-size:12px; font-weight:600; }
        .source-tabs { display:flex; gap:8px; flex-wrap:wrap; }
        .src-tab { padding:7px 12px; border-radius:8px; border:1.5px solid rgba(255,255,255,0.2); color:rgba(255,255,255,0.6); font-size:13px; cursor:pointer; background:transparent; }
        .src-tab.active { background:rgba(206,147,216,0.25); border-color:#ce93d8; color:#fff; font-weight:600; }
        .status-bar { background:rgba(20,0,40,0.7); border-radius:8px; padding:8px 14px; color:#ce93d8; font-size:13px; display:flex; align-items:center; gap:8px; }
        .dot { width:8px; height:8px; border-radius:50%; background:#4caf50; flex-shrink:0; }
        .dot.loading { background:#ffc107; animation:pulse 1s infinite; }
        @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.4} }
        .content { display:flex; gap:14px; flex:1; min-height:0; }
        #map { flex:1; border-radius:14px; overflow:hidden; min-height:350px; z-index:1; }
        .results-panel { width:270px; flex-shrink:0; display:flex; flex-direction:column; gap:8px; overflow-y:auto; }
        .results-header { color:#ce93d8; font-size:13px; font-weight:600; padding:2px 0; }
        .result-card { background:rgba(20,0,40,0.88); border-radius:12px; padding:12px; color:#fff; border:1px solid rgba(255,255,255,0.08); cursor:pointer; transition:border-color 0.2s; }
        .result-card:hover, .result-card.active { border-color:rgba(206,147,216,0.5); }
        .rc-name { font-size:14px; font-weight:700; margin-bottom:3px; }
        .rc-row { font-size:13px; color:#ce93d8; display:flex; justify-content:space-between; margin-bottom:4px; }
        .rc-dist { color:#a5d6a7; }
        .rc-addr { font-size:13px; color:#e1bee7; margin-bottom:6px; line-height:1.5; }
        .rc-tags { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:8px; }
        .rc-tag { font-size:11px; padding:2px 7px; border-radius:10px; background:rgba(206,147,216,0.15); border:1px solid rgba(206,147,216,0.3); color:#ce93d8; }
        .btn-gmap { display:block; width:100%; padding:7px; background:#7b1fa2; color:#fff; border:none; border-radius:8px; font-size:13px; font-weight:600; text-align:center; text-decoration:none; margin-top:6px; }
        .btn-gmap:hover { background:#9c4dcc; }
        .no-results { text-align:center; color:#ce93d8; padding:24px 10px; font-size:14px; line-height:2; }
        .loading-msg { text-align:center; color:#ce93d8; padding:20px; font-size:14px; }
        .leaflet-popup-content-wrapper { background:#2d0050; color:#fff; border-radius:10px; border:1px solid rgba(206,147,216,0.4); }
        .leaflet-popup-tip { background:#2d0050; }
        .leaflet-popup-content { font-size:13px; line-height:1.6; margin:10px 14px; }
        /* ── MOBILE ── */
        @media (max-width:700px) {
            body { flex-direction:column; }
            .topbar { display:flex; }
            .sidebar { position:fixed; top:0; left:0; height:100vh; transform:translateX(-100%); padding-top:56px; min-height:unset; }
            .sidebar.open { transform:translateX(0); box-shadow:4px 0 20px rgba(0,0,0,0.4); }
            .app-body { flex:1; overflow:hidden; }
            .main { padding:12px !important; }
            .content { flex-direction:column; }
            .results-panel { width:100%; max-height:300px; }
            #map { min-height:260px; }
            .search-bar { gap:6px; }
            .search-bar input { min-width:100%; }
        }
    </style>
</head>
<body>
    <!-- Mobile topbar -->
    <div class="topbar">
        <div class="tbrand">🏠 Roomie Connect</div>
        <button class="hamburger" onclick="toggleSidebar()"><span></span><span></span><span></span></button>
    </div>
    <div class="overlay" id="overlay" onclick="closeSidebar()"></div>
    <div class="app-body">
    <div class="sidebar">
        <div class="brand">🏠 Roomie Connect</div>
        <a href="form.html">My Preferences</a>
        <a href="p.html">My Profile</a>
        <a href="profiles.html">Find Roommates</a>
        <a href="requests.html">📩 Requests</a>
        <a href="chat.html">💬 Chats</a>
        <a href="map.html" class="active">🗺️ Hostel Map</a>
        <a href="about.html">ℹ️ About</a>
        <a href="index.html" class="logout" onclick="logout()">Logout</a>
    </div>

    <div class="main">
        <div>
            <div class="page-title">🗺️ Hostel & PG Finder</div>
        </div>
        <div class="search-bar">
            <input type="text" id="searchLocation" placeholder="📍 Enter location" value="Bhimavaram, Andhra Pradesh">
            <select id="placeType">
                <option value="all">🔍 All Accommodation</option>
                <option value="hostel">🛏️ Hostels</option>
                <option value="guest_house">🏠 Guest House / PG</option>
                <option value="hotel">🏨 Hotels / Lodges</option>
            </select>
            <button class="btn" onclick="doSearch()">🔍 Search</button>
            <button class="btn btn-sec" onclick="useMyLocation()">📍 My Location</button>
        </div>
        
        <div class="status-bar">
            <div class="dot" id="dot"></div>
            <span id="statusText">Ready — click Search to find hostels</span>
        </div>
        <div class="content">
            <div id="map"></div>
            <div class="results-panel" id="resultsPanel">
                <div class="no-results">🏘️ Results appear here<br><br>Enter a location and click <strong style="color:#fff">Search</strong></div>
            </div>
        </div>
    </div>
    </div><!-- end app-body -->

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="api.js"></script>
    <script>
        requireAuth();
        function toggleSidebar(){document.querySelector('.sidebar').classList.toggle('open');document.getElementById('overlay').classList.toggle('show');}
        function closeSidebar(){document.querySelector('.sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show');}
        document.querySelectorAll('.sidebar a').forEach(a=>a.addEventListener('click',()=>{if(window.innerWidth<=700)closeSidebar();}));

        let currentSource = 'osm';
        const map = L.map('map').setView([16.5449, 81.5212], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors', maxZoom: 19
        }).addTo(map);

        let markers = [], userMarker = null;

        function makeIcon(color) {
            return L.divIcon({
                className: '',
                html: `<div style="width:13px;height:13px;border-radius:50%;background:${color};border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.6)"></div>`,
                iconSize:[13,13], iconAnchor:[6,6], popupAnchor:[0,-8]
            });
        }
        function clearMarkers() { markers.forEach(m => map.removeLayer(m)); markers = []; }
        function setStatus(msg, loading=false) {
            document.getElementById('statusText').textContent = msg;
            const dot = document.getElementById('dot');
            dot.className = 'dot' + (loading ? ' loading' : '');
            dot.style.background = loading ? '#ffc107' : msg.includes('Error')||msg.includes('No ') ? '#f44336' : '#4caf50';
        }
        function switchSource(src) {
            currentSource = src;
            document.querySelectorAll('.src-tab').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + src).classList.add('active');
        }

        async function geocode(query) {
            const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=1`;
            const res = await fetch(url, { headers: {'Accept-Language':'en'} });
            const data = await res.json();
            if (!data.length) throw new Error('Location not found. Try adding state name.');
            return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
        }

        async function searchOverpass(lat, lng, type) {
            const r = 5000;
            let filter = '';
            if (type==='hostel')      filter=`node["tourism"="hostel"](around:${r},${lat},${lng});way["tourism"="hostel"](around:${r},${lat},${lng});`;
            else if(type==='guest_house') filter=`node["tourism"="guest_house"](around:${r},${lat},${lng});way["tourism"="guest_house"](around:${r},${lat},${lng});`;
            else if(type==='hotel')   filter=`node["tourism"="hotel"](around:${r},${lat},${lng});way["tourism"="hotel"](around:${r},${lat},${lng});`;
            else filter=`node["tourism"~"hostel|guest_house|hotel|motel|lodging"](around:${r},${lat},${lng});way["tourism"~"hostel|guest_house|hotel|motel|lodging"](around:${r},${lat},${lng});`;
            const query = `[out:json][timeout:20];(${filter});out center tags;`;
            const servers = ['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];
            for (const server of servers) {
                try {
                    const res = await fetch(`${server}?data=${encodeURIComponent(query)}`);
                    const text = await res.text();
                    if (text.trim().startsWith('<')) continue;
                    return JSON.parse(text).elements || [];
                } catch(e) { continue; }
            }
            return null;
        }

        async function searchNominatim(location, type) {
            const kw = {hostel:'hostel',guest_house:'guest house PG paying guest',hotel:'hotel lodge',all:'hostel PG accommodation'}[type]||'hostel';
            const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(kw+' near '+location)}&format=json&limit=20`;
            const res = await fetch(url, {headers:{'Accept-Language':'en'}});
            const data = await res.json();
            return data.map(p=>({lat:parseFloat(p.lat),lon:parseFloat(p.lon),tags:{name:p.display_name.split(',')[0],tourism:p.type},_addr:p.display_name}));
        }

        async function doSearch() {
            const location = document.getElementById('searchLocation').value.trim();
            const type     = document.getElementById('placeType').value;
            if (!location) { alert('Enter a location first.'); return; }
            if (currentSource === 'gmaps') {
                const kw = type==='all'?'hostel OR PG OR guest house':type.replace('_',' ');
                window.open(`https://www.google.com/maps/search/${encodeURIComponent(kw+' in '+location)}`,'_blank');
                setStatus('Opened Google Maps');
                return;
            }
            setStatus('Finding location...', true);
            document.getElementById('resultsPanel').innerHTML = '<div class="loading-msg">🔍 Searching...</div>';
            clearMarkers();
            try {
                const center = await geocode(location);
                map.setView([center.lat, center.lng], 14);
                if (userMarker) map.removeLayer(userMarker);
                userMarker = L.marker([center.lat,center.lng],{icon:makeIcon('#ce93d8')}).addTo(map).bindPopup(`<strong>📍 ${location}</strong>`);

                let places = [];
                if (currentSource==='osm') {
                    setStatus('Searching OpenStreetMap...', true);
                    places = await searchOverpass(center.lat, center.lng, type);
                    if (places===null || places.length===0) {
                        setStatus('Trying Nominatim...', true);
                        places = await searchNominatim(location, type);
                    }
                } else {
                    setStatus('Searching via Nominatim...', true);
                    places = await searchNominatim(location, type);
                }
                setStatus(`✅ Found ${places.length} places near ${location}`);
                renderResults(places, center, location);
            } catch(e) {
                setStatus('Error: '+e.message);
                document.getElementById('resultsPanel').innerHTML=`<div class="no-results">❌ ${e.message}<br><br><a href="https://www.google.com/maps/search/hostel+near+${encodeURIComponent(location)}" target="_blank" style="color:#ce93d8">Search Google Maps →</a></div>`;
            }
        }

        function renderResults(places, center, locationName) {
            const panel = document.getElementById('resultsPanel');
            if (!places.length) { panel.innerHTML=`<div class="no-results">😔 No results found.<br><br><a href="https://www.google.com/maps/search/hostel+near+${encodeURIComponent(locationName)}" target="_blank" style="color:#ce93d8">Try Google Maps →</a></div>`; return; }
            places.sort((a,b)=>getDist(center.lat,center.lng,a.lat||a.center?.lat||0,a.lon||a.center?.lon||0)-getDist(center.lat,center.lng,b.lat||b.center?.lat||0,b.lon||b.center?.lon||0));
            panel.innerHTML=`<div class="results-header">📍 ${places.length} places found</div>`;
            places.forEach((place,i)=>{
                const lat=place.lat||place.center?.lat, lng=place.lon||place.center?.lon;
                if(!lat||!lng) return;
                const name=place.tags?.name||'Hostel/PG';
                const tourism=place.tags?.tourism||'accommodation';
                const addr=place._addr||[place.tags?.['addr:street'],place.tags?.['addr:city']].filter(Boolean).join(', ')||'';
                const phone=place.tags?.phone||'';
                const dist=getDist(center.lat,center.lng,lat,lng);
                const tags=[];
                if(place.tags?.internet_access==='yes'||place.tags?.internet_access==='wlan') tags.push('📶 WiFi');
                if(place.tags?.female_only==='yes') tags.push('👩 Girls Only');
                if(place.tags?.male_only==='yes') tags.push('👨 Boys Only');
                const marker=L.marker([lat,lng],{icon:makeIcon('#9c4dcc')}).addTo(map)
                    .bindPopup(`<strong>${name}</strong><br>${tourism}<br>${addr?'📍 '+addr:''}<br><strong>${dist.toFixed(1)} km away</strong>`);
                markers.push(marker);
                const card=document.createElement('div');
                card.className='result-card';
                card.innerHTML=`<div class="rc-name">${name}</div><div class="rc-row"><span>🏠 ${tourism.replace(/_/g,' ')}</span><span class="rc-dist">📍 ${dist.toFixed(1)} km</span></div>${addr?`<div class="rc-addr">${addr.length>60?addr.substring(0,60)+'...':addr}</div>`:''}${phone?`<div class="rc-addr">📞 ${phone}</div>`:''}${tags.length?`<div class="rc-tags">${tags.map(t=>`<span class="rc-tag">${t}</span>`).join('')}</div>`:''}<a class="btn-gmap" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name+' '+addr)}" target="_blank">📍 Open in Google Maps</a>`;
                card.onclick=e=>{if(e.target.tagName==='A')return;map.flyTo([lat,lng],17);marker.openPopup();document.querySelectorAll('.result-card').forEach(c=>c.classList.remove('active'));card.classList.add('active');};
                panel.appendChild(card);
            });
            if(markers.length){try{map.fitBounds(L.featureGroup(markers).getBounds().pad(0.25));}catch(e){}}
        }

        function useMyLocation() {
            if(!navigator.geolocation){alert('Geolocation not supported.');return;}
            setStatus('Getting your location...', true);
            navigator.geolocation.getCurrentPosition(pos=>{
                const {latitude:lat,longitude:lng}=pos.coords;
                map.setView([lat,lng],14);
                if(userMarker)map.removeLayer(userMarker);
                userMarker=L.marker([lat,lng],{icon:makeIcon('#ce93d8')}).addTo(map).bindPopup('📍 You').openPopup();
                document.getElementById('searchLocation').value=`${lat.toFixed(5)}, ${lng.toFixed(5)}`;
                doSearch();
            },()=>{setStatus('Location denied.');alert('Allow location access.');});
        }

        function getDist(lat1,lng1,lat2,lng2){
            const R=6371,dLat=(lat2-lat1)*Math.PI/180,dLng=(lng2-lng1)*Math.PI/180;
            const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
            return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
        }

        window.addEventListener('load', ()=>setTimeout(doSearch, 600));
    </script>
</body>
</html>
