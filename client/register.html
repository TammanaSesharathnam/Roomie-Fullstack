<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roomie Connect - Register</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #6a1b9a 0%, #9c4dcc 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 36px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.25);
    }
    h1 { color: #6a1b9a; font-size: 24px; margin-bottom: 6px; }
    .sub { color: #888; font-size: 13px; margin-bottom: 24px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-group { margin-bottom: 14px; }
    label { font-size: 13px; color: #555; display: block; margin-bottom: 5px; font-weight: 600; }
    input, select {
      width: 100%;
      padding: 11px 13px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
    }
    input:focus, select:focus { outline: none; border-color: #6a1b9a; }
    .section-title {
      font-size: 13px;
      font-weight: 700;
      color: #6a1b9a;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 18px 0 10px;
      border-bottom: 1px solid #f0e6f6;
      padding-bottom: 6px;
    }
    .btn {
      width: 100%;
      padding: 13px;
      background: #6a1b9a;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn:hover { background: #9c4dcc; }
    .signin-link { text-align: center; margin-top: 14px; font-size: 13px; color: #555; }
    .signin-link a { color: #6a1b9a; font-weight: 600; text-decoration: none; }
    .error-msg { color: #e53935; font-size: 13px; margin-top: 8px; display: none; }
    .success-msg { color: #2e7d32; font-size: 13px; margin-top: 8px; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🏠 Create Account</h1>
    <p class="sub">Join Roomie Connect and find your perfect roommate</p>

    <div class="section-title">Basic Info</div>
    <div class="form-row">
      <div class="form-group">
        <label>Full Name *</label>
        <input type="text" id="name" placeholder="Your name">
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="tel" id="phone" placeholder="10-digit number">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Email *</label>
        <input type="email" id="email" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Password *</label>
        <input type="password" id="password" placeholder="Min 6 chars">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Location</label>
        <input type="text" id="location" placeholder="City / Area">
      </div>
      <div class="form-group">
        <label>Budget (₹/month)</label>
        <input type="number" id="budget" placeholder="e.g. 5000">
      </div>
    </div>

    <div class="section-title">Preferences</div>
    <div class="form-row">
      <div class="form-group">
        <label>Gender *</label>
        <select id="gender">
          <option value="">Select</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>Diet *</label>
        <select id="diet">
          <option value="">Select</option>
          <option value="veg">Vegetarian</option>
          <option value="nonveg">Non-Vegetarian</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Personality *</label>
        <select id="personality">
          <option value="">Select</option>
          <option value="introvert">Introvert</option>
          <option value="extrovert">Extrovert</option>
        </select>
      </div>
      <div class="form-group">
        <label>Schedule *</label>
        <select id="schedule">
          <option value="">Select</option>
          <option value="morningbird">Morning Bird</option>
          <option value="nightowl">Night Owl</option>
        </select>
      </div>
    </div>

    <div class="error-msg"  id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>

    <button class="btn" onclick="doRegister()">Create Account</button>
    <div class="signin-link">Already have an account? <a href="index.html">Sign In</a></div>
  </div>

  <script src="api.js"></script>
  <script>
    async function doRegister() {
      const errEl  = document.getElementById('errorMsg');
      const succEl = document.getElementById('successMsg');
      errEl.style.display = 'none';
      succEl.style.display = 'none';

      const data = {
        name:        document.getElementById('name').value.trim(),
        phone:       document.getElementById('phone').value.trim(),
        email:       document.getElementById('email').value.trim(),
        password:    document.getElementById('password').value.trim(),
        location:    document.getElementById('location').value.trim(),
        budget:      Number(document.getElementById('budget').value) || 0,
        gender:      document.getElementById('gender').value,
        diet:        document.getElementById('diet').value,
        personality: document.getElementById('personality').value,
        schedule:    document.getElementById('schedule').value,
      };

      const required = ['name','email','password','gender','diet','personality','schedule'];
      for (const f of required) {
        if (!data[f]) {
          errEl.textContent = `Please fill in: ${f}`;
          errEl.style.display = 'block';
          return;
        }
      }
      if (data.password.length < 6) {
        errEl.textContent = 'Password must be at least 6 characters.';
        errEl.style.display = 'block';
        return;
      }

      try {
        const res = await api.register(data);
        saveSession(res.token, res.user);
        succEl.textContent = 'Account created! Redirecting...';
        succEl.style.display = 'block';
        setTimeout(() => window.location.href = 'form.html', 1200);
      } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
      }
    }
  </script>
</body>
</html>
